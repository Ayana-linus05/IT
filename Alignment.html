<html>
	<head>
		<title> Text alignment </title>
	</head>

	<body>
		<p> This text is in default alignment. </p>
		<hr>
		<center>
		<p> This text is in center alignment. </p>
		</center>
		<hr>
		<p align = "right"> This text is in right alignment. </p>
		<hr>
		<p align = "left"> This text is in left alignment. </p>
		<hr>
	</body>
</html>
